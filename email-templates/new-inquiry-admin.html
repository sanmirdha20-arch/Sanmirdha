<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New inquiry</title>
</head>
<body style="margin:0;padding:0;background:#fafaf9;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{name}} wants a {{project_type}}. Open your admin panel to reply.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fafaf9;">
  <tr><td align="center" style="padding:32px 16px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #e7e5e4;border-radius:20px;">
      <tr><td style="padding:28px 36px 0;font-family:Arial,Helvetica,sans-serif;">
        <div style="display:inline-block;background:#e6faf5;color:#00694f;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 12px;border-radius:999px;">New inquiry</div>
        <h1 style="margin:14px 0 4px;font-size:24px;line-height:1.25;letter-spacing:-0.02em;color:#0a0a0a;">{{name}} wants a {{project_type}}</h1>
        <p style="margin:0;font-size:13px;color:#6b6b6b;">{{received_at}}</p>
      </td></tr>
      <tr><td style="padding:20px 36px 0;font-family:Arial,Helvetica,sans-serif;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="font-size:15px;color:#262626;">
          <tr><td width="90" style="padding:6px 0;color:#6b6b6b;">Email</td><td style="padding:6px 0;"><a href="mailto:{{email}}" style="color:#0a0a0a;">{{email}}</a></td></tr>
          <tr><td style="padding:6px 0;color:#6b6b6b;">Project</td><td style="padding:6px 0;">{{project_type}}</td></tr>
          <tr><td style="padding:6px 0;color:#6b6b6b;">Budget</td><td style="padding:6px 0;">{{budget}}</td></tr>
        </table>
        <div style="margin-top:14px;background:#f5f5f4;border-radius:12px;padding:16px;font-size:15px;line-height:1.6;color:#262626;white-space:pre-wrap;">{{message}}</div>
      </td></tr>
      <tr><td style="padding:24px 36px 32px;font-family:Arial,Helvetica,sans-serif;">
        <a href="{{admin_url}}" style="display:inline-block;background:#0a0a0a;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:13px 24px;border-radius:999px;">Open in admin panel</a>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
